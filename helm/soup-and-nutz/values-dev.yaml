# Development environment values
replicaCount: 1

image:
  repository: adamrobbie549/soup-and-nutz
  tag: "latest"
  pullPolicy: Always

service:
  type: ClusterIP
  port: 80
  targetPort: 4000

# MCP Server Service
mcpService:
  enabled: true
  type: ClusterIP
  port: 3002
  targetPort: 3002

ingress:
  enabled: true
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
  hosts:
    - host: soup-and-nutz-dev.local
      paths:
        - path: /
          pathType: Prefix

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

autoscaling:
  enabled: false

# AI System configuration
aiSystem:
  enabled: true
  # MCP Server configuration
  mcp:
    enabled: true
    port: 3002
  # AI Model configuration
  models:
    default: "gpt-3.5-turbo"
    fallback: "gpt-4"
  # Vector database configuration
  vectorDb:
    enabled: true
    similarityThreshold: 0.7
    maxResults: 10

postgresql:
  enabled: true
  auth:
    postgresPassword: "dev-password"
    database: "soup_and_nutz_dev"
  primary:
    persistence:
      enabled: false

redis:
  enabled: true
  auth:
    enabled: false
  master:
    persistence:
      enabled: false

config:
  secretKeyBase: "dev-secret-key-base-for-development-only"
  databaseUrl: "postgresql://postgres:dev-password@soup-and-nutz-dev-postgresql:5432/soup_and_nutz_dev"
  host: "0.0.0.0"
  port: 4000 