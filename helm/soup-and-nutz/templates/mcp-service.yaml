{{- if .Values.mcpService.enabled -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "soup-and-nutz.fullname" . }}-mcp
  labels:
    {{- include "soup-and-nutz.labels" . | nindent 4 }}
    app.kubernetes.io/component: mcp-server
spec:
  type: {{ .Values.mcpService.type }}
  ports:
    - port: {{ .Values.mcpService.port }}
      targetPort: {{ .Values.mcpService.targetPort }}
      protocol: TCP
      name: mcp
  selector:
    {{- include "soup-and-nutz.selectorLabels" . | nindent 4 }}
{{- end -}} 